name: build SapMachine-java
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - SapMachine-java11/**
      - SapMachine-java17/**
      - SapMachine-java21/**
      - SapMachine-java25/**
jobs:
  push:
    name: "yolks:sapmachine-java${{ matrix.tag }}/${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sapmachine:11 / sapmachine:17 は Docker Hub で linux/amd64 のみ提供されている
        include:
          - tag: '11'
            arch: 'amd64'
            platforms: linux/amd64
          - tag: '17'
            arch: 'amd64'
            platforms: linux/amd64
          - tag: '21'
            arch: 'amd64,arm64'
            platforms: linux/amd64,linux/arm64
          - tag: '25'
            arch: 'amd64,arm64'
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v2
      - uses: docker/setup-qemu-action@v1
      - uses: docker/setup-buildx-action@v1
        with:
          version: "v0.5.1"
          buildkitd-flags: --debug
      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUBTOKEN }}
      - uses: docker/build-push-action@v2
        with:
          context: ./SapMachine-java${{ matrix.tag }}
          file: ./SapMachine-java${{ matrix.tag }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/mg8853/yolks:sapmachine-java${{ matrix.tag }}
